# Test properties to satisfy placeholders during unit tests
# Minimal Keycloak defaults for tests (won't be used at runtime)
keycloak.auth-server-url=http://localhost:8080/realms/eshop
keycloak.realm=eshop
keycloak.client-id=eshop-client
keycloak.client-secret=test-secret
keycloak.resource=eshop-backend
keycloak.credentials.secret=test-secret

# Disable actual Keycloak usage in tests
keycloak.enabled=false

# Provide a jwk-set-uri default used by resource server config
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/realms/eshop/protocol/openid-connect/certs
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/eshop

app.security.jwt.authority-prefix=ROLE_
app.security.jwt.authorities-claim-name=roles
app.security.jwt.audiences=eshop-test
app.security.jwt.issuer-uri=http://localhost:8180/realms/eshop-dev
app.security.jwt.jwk-set-uri=http://localhost:8180/realms/eshop-dev/protocol/openid-connect/certs
app.security.admin.issuer-uri=http://localhost:8180/realms/eshop-admin
app.security.jwt.allowed-algorithms=RS256
app.security.jwt.access-token-expiry=PT15M
app.security.jwt.clock-skew=PT30S
app.security.jwt.claim-mappings.username-claim=preferred_username

# CORS Defaults for Test
app.cors.allowed-origins=*
app.cors.allowed-methods=*
app.cors.allowed-headers=*
app.cors.exposed-headers=*
app.cors.max-age=3600

# Database - Use H2
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

# App Properties defaults for tests
app.backend-url=http://localhost:8080
app.security.default-redirect-uri=http://localhost:3000
app.security.allowed-redirect-uris=http://localhost:3000
app.storage.base-url=http://localhost:8080/uploads
spring.data.redis.host=localhost

# Satisfy placeholders from application.properties
JWT_SECRET=testSecretKeyForJWTSignaturesWhichIsLongEnough
JWT_EXPIRATION=3600000
JWT_REFRESH_EXPIRATION=86400000
PORT=8080
CONTEXT_PATH=/
APP_DEFAULT_REDIRECT_URI=http://localhost:3000
ALLOWED_ORIGINS=http://localhost:3000
APP_BACKEND_URL=http://localhost:8080
DB_URL=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
DB_USERNAME=sa
DB_PASSWORD=
ZIPKIN_ENDPOINT=http://localhost:9411
KEYCLOAK_AUTH_SERVER=http://localhost:8080
ESHOP_REALM_NAME=eshop
ADMIN_REALM_NAME=eshop-admin
ESHOP_BACKEND_CLIENT_ID=eshop-client
ESHOP_BACKEND_CLIENT_SECRET=secret
KEYCLOAK_ADMIN_USER=admin
KEYCLOAK_ADMIN_PASSWORD=admin
KEYCLOAK_ADMIN_CLIENT_ID=admin-cli
REDIS_HOST=localhost
REDIS_PORT=6379
REDIS_PASSWORD=
DEFAULT_COMMISSION_RATE=0.05
DEFAULT_CURRENCY=INR
READ_REPLICAS_ENABLED=false
