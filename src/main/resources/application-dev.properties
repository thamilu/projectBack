# ============================================
# E-COMMERCE BACKEND - DEVELOPMENT PROFILE
# Spring Boot 4.0.0 + Java 25
# ============================================
# This file overrides application.properties for development environment
# Use environment variables for sensitive data even in dev

# ─────────────────────────────────────────────
# LAZY INITIALIZATION — disabled (was a real cause of "backend running slow")
# ─────────────────────────────────────────────
# This was `true` under the theory that skipping bean construction at
# startup makes dev restarts faster. Measured against the actual dev log
# (eshop-dev-local.log): "Started EshopApplication" still took 61.6s with
# this on — most of that time is Hibernate/JPA metamodel building for 70+
# repositories and Spring's own context refresh, none of which lazy-init
# can skip. What it DID skip: DispatcherServlet and BOTH Keycloak
# SecurityFilterChains (user realm + admin realm) weren't constructed at
# startup at all — they were deferred to whichever real request first
# needed them, at which point that one request paid the full cost inline:
# DispatcherServlet.initStrategies() (~1.3s) plus two separate blocking
# OIDC-discovery HTTP calls to Keycloak (one per realm, each doing a
# `.well-known/openid-configuration` + JWKS fetch), ~6s total, observed
# landing on a `tomcat-handler` thread mid-request rather than in startup
# logs. That's "backend feels randomly slow" from the outside: fast,
# misleading "Started" line, then unpredictable multi-second stalls
# scattered across whichever features get touched first each session.
# Matches prod (already `false` there) — startup is honestly slower to
# report, but nothing pays a hidden first-use tax during real requests.
spring.main.lazy-initialization=false

# CRITICAL-006 FIX: Removed redundant datasource driver/url/user/pass (inherited from base)

# HikariCP - Dev Overrides
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.auto-commit=false
# (timeouts and lifetime inherited from base)

# ─────────────────────────────────────────────
# JPA & HIBERNATE - DEVELOPMENT
# ─────────────────────────────────────────────
# DDL Auto Options:
# - update: Keep test data, update schema (recommended for dev)
# - create: Drop and recreate on startup (fixes schema issues)
# - create-drop: Reset database on restart (useful for testing)
# - validate: Only validate schema (safer)
# spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:create-drop}
# spring.jpa.hibernate.ddl-auto=${DDL_AUTO:create}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Performance Overrides
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.jdbc.fetch_size=50
spring.jpa.properties.hibernate.default_batch_fetch_size=10
# (order inserts/updates and batch versioned inherited from base)

# Second-Level Cache (disabled for Caffeine-only configuration)
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false

# Statistics for Debugging (Dev Only)
spring.jpa.properties.hibernate.generate_statistics=true

# CRITICAL-006 FIX: Removed deprecated hibernate.dialect property
# Hibernate 7 auto-detects dialect from datasource - explicit config not needed
# But if it fails to detect, explicit setting helps.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true

# ─────────────────────────────────────────────
# FLYWAY (Disabled in Dev - Using Hibernate DDL Auto)
# ─────────────────────────────────────────────
spring.flyway.enabled=false

# Redis/Cache - Overrides
spring.cache.type=redis
# (connection settings, pool, and repositories flag inherited from base)
# (resilient mode, enablement, and ttl inherited from base)

# JWT - Overrides
jwt.issuer=eshop-app
jwt.algorithm=HS512
# (secrets and expiration inherited from base)


# Spring Boot `JwtProperties` (app.security.jwt) - required by binding/validation
# Use Keycloak local dev endpoints where available; keep values safe for local dev only.
app.security.jwt.audiences=eshop-client
app.security.jwt.issuer-uri=${KEYCLOAK_AUTH_SERVER}/realms/${ESHOP_REALM_NAME}
app.security.jwt.jwk-set-uri=${app.security.jwt.issuer-uri}/protocol/openid-connect/certs
app.security.jwt.allowed-algorithms=RS256
app.security.jwt.access-token-expiry=PT15M
app.security.jwt.clock-skew=PT30S
app.security.jwt.authorities-claim-name=roles
app.security.jwt.authority-prefix=ROLE_

# Align admin issuer with user realm for easier dev (matches common local setup)
app.security.admin.issuer-uri=${KEYCLOAK_AUTH_SERVER}/realms/eshop-admin



# Claim mappings object must be present (fields have defaults, but object cannot be null)
app.security.jwt.claim-mappings.username-claim=preferred_username
app.security.jwt.claim-mappings.email-claim=email
app.security.jwt.claim-mappings.realm-roles-path=realm_access.roles

# ─────────────────────────────────────────────
# SEED DATA CONFIGURATION (Development Only)
# ─────────────────────────────────────────────
# ─────────────────────────────────────────────
# SEED USERS - Development personas
# ─────────────────────────────────────────────
# Seeding Configuration
app.seed.enabled=${SEED_ENABLED:true}
# Skips wipe-and-reseed if users already exist (e.g. after a restart).
# Set SEED_FORCE_RESEED=true to wipe and reseed anyway.
app.seed.force-reseed=${SEED_FORCE_RESEED:false}
app.seed.users-enabled=true
app.seed.categories-enabled=true
app.seed.brands-enabled=true
app.seed.tags-enabled=true
app.seed.shops-enabled=true
app.seed.products-enabled=true
app.seed.locations-enabled=true

# Users are now loaded from src/main/resources/seed/users.json


# ─────────────────────────────────────────────
# MONITORING & METRICS - DISABLED (Containers Removed)
# ─────────────────────────────────────────────
management.metrics.export.prometheus.enabled=false
management.tracing.enabled=false


# ─────────────────────────────────────────────
# PAYMENT GATEWAYS (Development/Test Mode)
# ─────────────────────────────────────────────
payment.enabled=true

# Stripe (Test Mode)
# Disabled by default: CredentialValidator/StripeConfigValidator fail startup
# fast (by design — see their own docs) when enabled=true but the real keys
# are missing. This file previously set `payment.stripe.enabled=true` while
# only defining keys under a bare `stripe.*` prefix — PaymentProperties
# binds `payment.stripe.*` (see PaymentProperties.java's
# @ConfigurationProperties(prefix = "payment") + nested StripeConfig), so
# those `stripe.*` lines were never actually read by anything; api-key and
# public-key were always empty, and webhook-secret was never set at all.
# To test real Stripe flows locally: set STRIPE_SECRET_KEY/STRIPE_PUBLIC_KEY/
# STRIPE_WEBHOOK_SECRET in your environment (never hardcode them here) and
# flip enabled back to true.
payment.stripe.enabled=false
payment.stripe.api-key=${STRIPE_SECRET_KEY:}
payment.stripe.public-key=${STRIPE_PUBLIC_KEY:}
payment.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
payment.stripe.currency=USD

# Razorpay (Test Mode) — disabled by default; same PaymentProperties prefix
# fix as Stripe above (was bare `razorpay.*`, PaymentProperties binds
# `payment.razorpay.*`). Enable and set real test keys via environment
# variables the same way as Stripe if you need to test this flow.
payment.razorpay.enabled=false
payment.razorpay.key-id=${RAZORPAY_KEY_ID:}
payment.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
payment.razorpay.currency=INR

# PayU (Test Mode)
payu.merchant-salt=${PAYU_MERCHANT_SALT:payu_test_merchant_salt}

# CORS - Dev Overrides
app.cors.allowed-headers=*
app.cors.allow-credentials=true
# (origins, methods, max-age, and exposed headers inherited from base)

# ─────────────────────────────────────────────
# LOGGING - VERBOSE FOR DEBUGGING
# ─────────────────────────────────────────────
# (root, spring security, hibernate SQL, and flyway logging inherited from base)
logging.file.name=logs/eshop-dev-local.log

# Console Output - Colored and Pretty
logging.pattern.console=%d{HH:mm:ss.SSS} %clr(%-5level) [%thread] %cyan(%logger{36}) - %msg%n
spring.output.ansi.enabled=always

# ─────────────────────────────────────────────
# ERROR HANDLING - SHOW DETAILS IN DEV
# ─────────────────────────────────────────────
spring.mvc.problemdetails.enabled=true

# Application Debug Mode
app.debug=true

# ─────────────────────────────────────────────
# SWAGGER/OPENAPI - ENABLED FOR DEV
# ─────────────────────────────────────────────
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
app.openapi.enabled=true
app.swagger.enabled=true

# SpringDoc OpenAPI OAuth2/Keycloak integration (DEV ONLY)
springdoc.swagger-ui.oauth.client-id=eshop-client
springdoc.swagger-ui.oauth.use-pkce-with-authorization-code-grant=true
springdoc.swagger-ui.oauth.scope-separator=space
springdoc.cache.disabled=true
# Show JSON schemas (models) by default in Swagger UI for easier testing
springdoc.swagger-ui.default-models-expand-depth=1
springdoc.swagger-ui.default-model-expand-depth=1

# (actuator exposure and health details inherited from base)
management.endpoint.health.show-details=always
# ─────────────────────────────────────────────
# RATE LIMITING - RELAXED FOR DEV
# ─────────────────────────────────────────────

app.ratelimit.enabled=false

# Resilience4j - Increased limits for dev
resilience4j.ratelimiter.instances.productCreate.limit-for-period=100
resilience4j.ratelimiter.instances.search.limit-for-period=100
resilience4j.ratelimiter.instances.dashboard.limit-for-period=500
resilience4j.ratelimiter.instances.analytics.limit-for-period=100

# ─────────────────────────────────────────────
# TRACING - DISABLED
# ─────────────────────────────────────────────
management.tracing.sampling.probability=0.0

# ─────────────────────────────────────────────
# API CONFIGURATION
# ─────────────────────────────────────────────
api.version=1.0.0
api.expose-tech-stack=true
app.json.pretty-print=true



# ─────────────────────────────────────────────
# FILE UPLOAD - RELAXED LIMITS FOR DEVt
# ─────────────────────────────────────────────
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB

# ─────────────────────────────────────────────
# CACHE - SHORTER TTL FOR DEV (Easy Testing)
# ─────────────────────────────────────────────
app.cache.dashboard.ttl=60
app.cache.statistics.ttl=60
app.cache.analytics.ttl=120
app.cache.products.ttl=300
app.cache.categories.ttl=600

# ─────────────────────────────────────────────
# PERFORMANCE - RELAXED FOR DEV
# ─────────────────────────────────────────────

server.tomcat.threads.max=50
server.tomcat.threads.min-spare=10
# Max header size (inherited from base: 20MB)