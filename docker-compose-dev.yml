# ══════════════════════════════════════════════════════════════
# LOCAL DEVELOPMENT SETUP [HARDENED]
# - Core Stack: PostgreSQL, Redis, Keycloak
# - Dev Tools: pgAdmin (for data verification)
# - Spring Boot backend runs locally (not in container)
# ══════════════════════════════════════════════════════════════

services:
  # ══════════════════════════════════════════════════════════════
  # PostgreSQL Database
  # ══════════════════════════════════════════════════════════════
  postgres:
    image: postgres:16-alpine
    container_name: eshop-postgres-dev
    restart: unless-stopped
    environment:
      TZ: Asia/Kolkata
      POSTGRES_DB: eshop_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "thamilu*884*"
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    networks:
      - eshop-dev-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 256M

  # ══════════════════════════════════════════════════════════════
  # Redis Cache
  # ══════════════════════════════════════════════════════════════
  redis:
    image: redis:7.4-alpine
    container_name: eshop-redis-dev
    restart: unless-stopped
    environment:
      TZ: Asia/Kolkata
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_dev_data:/data
    networks:
      - eshop-dev-net
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M

  # ══════════════════════════════════════════════════════════════
  # Keycloak - Authentication Server
  # ══════════════════════════════════════════════════════════════
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.1
    container_name: eshop-keycloak-dev
    restart: unless-stopped
    environment:
      TZ: Asia/Kolkata
      # JVM Tuning for Stability
      JAVA_OPTS: "-Xms256m -Xmx512m"
      JAVA_OPTS_APPEND: "-Duser.timezone=Asia/Kolkata"

      # ── Master Realm Admin ──
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: "Admin@@Secret123"

      # ── Database Connection ──
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/eshop_keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: "thamilu*884*"

      # ── Server Configuration ──
      KC_HOSTNAME_URL: "http://localhost:8080"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"

      # ── Realm Import Variables (used in JSON files) ──
      ADMIN_EMAIL: "admin@eshop.com"
      ADMIN_INITIAL_PASSWORD: "Admin@@Secret123"
      ESHOP_BACKEND_CLIENT_SECRET: "eshop-backend-dev-secret"
      ESHOP_ADMIN_BACKEND_SECRET: "eshop-admin-backend-dev-secret"

      # ── Social Login (dev placeholders) ──
      GOOGLE_CLIENT_ID: "placeholder"
      GOOGLE_CLIENT_SECRET: "placeholder"
      FACEBOOK_CLIENT_ID: "placeholder"
      FACEBOOK_CLIENT_SECRET: "placeholder"

    ports:
      - "8080:8080"
    volumes:
      - ./keycloak-themes:/opt/keycloak/themes
      - ./keycloak-import:/opt/keycloak/data/import
      - keycloak_dev_data:/opt/keycloak/data
    command:
      - start-dev
      - --import-realm
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - eshop-dev-net
    healthcheck:
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
        reservations:
          cpus: '0.5'
          memory: 512M

  # ══════════════════════════════════════════════════════════════
  # pgAdmin - PostgreSQL Management Tool
  # ══════════════════════════════════════════════════════════════
  pgadmin:
    image: dpage/pgadmin4:9.14
    container_name: eshop-pgadmin-dev
    restart: unless-stopped
    environment:
      TZ: Asia/Kolkata
      PGADMIN_DEFAULT_EMAIL: admin@eshop.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "True"
    ports: 
      - "5050:80"
    volumes:
      - pgadmin_dev_data:/var/lib/pgadmin
    networks:
      - eshop-dev-net
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

# ══════════════════════════════════════════════════════════════
# Volumes - Persistent Data Storage
# ═══════════════════════════════════════════════════════════
volumes:
  redis_dev_data:
    driver: local
  postgres_dev_data:
    driver: local
  pgadmin_dev_data:
    driver: local
  keycloak_dev_data:
    driver: local

# ══════════════════════════════════════════════════════════════
# Networks - Container Communication
# ══════════════════════════════════════════════════════════════
networks:
  eshop-dev-net:
    driver: bridge
    name: eshop-dev-network
