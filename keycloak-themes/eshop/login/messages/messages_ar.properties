termsText=<div class="kc-terms-metadata"><span>\u0627\u0644\u0625\u0635\u062d\u0627\u0631 1.0</span> &bull; <span>\u062a\u0645 \u0627\u0644\u062a\u062d\u062f\u064a\u062b: \u064a\u0648\u0646\u064a\u0648 2026</span></div><p>\u0645\u0631\u062d\u0628\u064b\u0627 \u0628\u0643 \u0641\u064a \u0633\u0648\u0642 E-Shop \u0644\u0644\u0645\u0624\u0633\u0633\u0627\u062a. \u064a\u0631\u062c\u064a \u0642\u0631\u0627\u0621\u0625 \u0634\u0631\u0648\u0637 \u0627\u0644\u062e\u062f\u0645\u0625 \u0648\u0633\u064a\u0627\u0633\u0625 \u0627\u0644\u062e\u0635\u0648\u0635\u064a\u0625 \u0628\u0639\u0646\u0627\u064a\u0625 \u0642\u0628\u0644 \u0627\u0633\u062a\u062e\u062f\u0627\u0645 \u0645\u0646\u0635\u062a\u0646\u0627.</p><h3>1. \u0627\u0633\u062a\u062e\u062f\u0627\u0645 \u0627\u0644\u062d\u0633\u0627\u0628</h3><p>\u064a\u062c\u0628 \u0639\u0644\u0649 \u0627\u0644\u0628\u0627\u0626\u0639\u064a\u0646 \u0648\u0627\u0644\u0645\u0634\u062a\u0631\u064a\u0646 \u0627\u0644\u062d\u0641\u0627\u0638 \u0639\u0644\u0649 \u0645\u0639\u0644\u0648\u0645\u0627\u062a \u062d\u0633\u0627\u0628 \u062f\u0642\u064a\u0642\u0625 \u0648\u0628\u064a\u0627\u0646\u0627\u062a \u0627\u0639\u062a\u0645\u0627\u062f \u0622\u0645\u0646\u0625. \u064a\u062d\u062a\u0641\u0638 E-Shop \u0628\u0627\u0644\u062d\u0642 \u0641\u064a \u062a\u0639\u0644\u064a\u0642 \u0627\u0644\u062d\u0633\u0627\u0628\u0627\u062a \u0627\u0644\u062a\u064a \u062a\u0646\u062a\u0647\u0643 \u0633\u0644\u0627\u0645\u0625 \u0645\u0646\u0635\u062a\u0646\u0627.</p><h3>2. \u0645\u0633\u0623\u0648\u0644\u064a\u0627\u062a \u0627\u0644\u0628\u0627\u0626\u0639</h3><p>\u0627\u0644\u062a\u062c\u0627\u0631 \u0645\u0633\u0624\u0648\u0644\u0648\u0646 \u0639\u0646 \u062f\u0642\u0625 \u0627\u0644\u0642\u0648\u0627\u0626\u0645\u0605 \u0648\u062c\u062f\u0627\u0648\u0644 \u0627\u0644\u062a\u0646\u0641\u064a\u0630 \u0627\u0644\u0632\u0645\u0646\u064a\u0625\u0605 \u0648\u062a\u062d\u062f\u064a\u062b\u0627\u062a \u0627\u0644\u0645\u062e\u0632\u0648\u0646\u0605 \u0648\u0627\u0644\u0627\u0645\u062a\u062b\u0627\u0644 \u0644\u0644\u0648\u0627\u0626\u062d \u0627\u0644\u0628\u064a\u0639 \u0628\u0627\u0644\u062a\u062c\u0632\u0625 \u0627\u0644\u0645\u062d\u0644\u064a\u0625.</p><h3>3. \u0645\u0639\u0627\u0645\u0644\u0627\u062a \u0627\u0644\u062f\u0641\u0639</h3><p>\u064a\u062a\u0645 \u0645\u0639\u0627\u0645\u0644\u0625 \u062c\u0645\u064a\u0639 \u0627\u0644\u0645\u062f\u0641\u0648\u0639\u0627\u062a \u0628\u0634\u0643\u0644 \u0622\u0645\u0646 \u0639\u0628\u0631 Stripe/E-Shop Payments. \u0627\u0644\u0645\u0639\u0627\u0645\u0644\u0625 \u062e\u0627\u0631\u062c \u0627\u0644\u0646\u0637\u0627\u0642 \u0645\u062d\u0638\u0648\u0631\u0625 \u062a\u0645\u0627\u0645\u064b\u0627 \u0648\u062a\u062e\u0636\u0639 \u0644\u0625\u0646\u0647\u0627\u0621 \u0627\u0644\u062d\u0633\u0627\u0628.</p><h3>4. \u0633\u064a\u0627\u0633\u0625 \u0627\u0644\u0627\u0633\u062a\u0631\u062f\u0627\u062f</h3><p>\u064a\u062c\u0628 \u0623\u0646 \u062a\u062a\u0648\u0627\u0641\u0642 \u0639\u0645\u0644\u064a\u0627\u062a \u0627\u0644\u0627\u0633\u062a\u0631\u062f\u0627\u062f \u0645\u0639 \u0636\u0645\u0627\u0646 \u0631\u0636\u0627 \u0627\u0644\u0639\u0645\u0644\u0627\u0621 \u0627\u0644\u0639\u0627\u0644\u0645\u064a \u0645\u0646 E-Shop \u0645\u0627 \u064ل\u0645 \u064a\u062a\u0645 \u0627\u0639\u062a\u0645\u0627\u062f \u0633\u064a\u0627\u0633\u0625 \u062a\u0627\u062c\u0631 \u0645\u062e\u0635\u0635\u0625 \u0648\u0639\u0631\u0636\u0647\u0627 \u0635\u0631\u0627\u062d\u0625.</p><h3>5. \u062e\u0635\u0648\u0635\u064a\u0625 \u0627\u0644\u0628\u064a\u0627\u0646\u0627\u062a</h3><p>\u0646\u0639\u0627\u0644\u062c \u0627\u0644\u0628\u064a\u0627\u0646\u0627\u062a \u0627\u0644\u0634\u062e\u0635\u064a\u0625 \u0648\u0628\u064a\u0627\u0646\u0627\u062a \u0627\u0644\u0645\u062a\u062c\u0631 \u0648\u0641\u0642\u064b\u0627 \u0644\u0633\u064a\u0627\u0633\u0625 \u0627\u0644\u062e\u0635\u0648\u0635\u064a\u0625 \u0648\u0634\u0647\u0627\u062f\u0627\u062a \u0627\u0644\u0623\u0645\u0627\u0646 \u0627\u0644\u0639\u0627\u0644\u0645\u064a\u0625 \u0627\u0644\u062e\u0627\u0635\u0625 \u0628\u0646\u0627 (PCI-DSS\u0605 ISO 27001).</p><h3>6. \u0627\u0644\u0645\u0644\u0643\u064a\u0625 \u0627\u0644\u0641\u0643\u0631\u064a\u0625</h3><p>\u064a\u062d\u062a\u0641\u0638 E-Shop \u0628\u062c\u0645\u064a\u0639 \u0627\u0644\u062d\u0642\u0648\u0642 \u0641\u064a \u0628\u0631\u0627\u0645\u062c\u0647\u0605 \u0648\u0623\u0635\u0648\u0644 \u0627\u0644\u0633\u0648\u0642\u0605 \u0648\u0623\u0645\u062e\u0631\u0649 \u0648\u0646\u0645\u0627\u0630\u062c \u0627\u0644\u0628\u064a\u0627\u0646\u0627\u062a \u0627\u0644\u062e\u0627\u0635\u0625 \u0628\u0647. \u064a\u062d\u062a\u0641\u0638 \u0627\u0644\u062a\u062c\u0627\u0631 \u0628\u0627\u0644\u062d\u0642\u0648\u0642 \u0641\u064a \u0639\u0644\u0627\u0645\u062a\u0647\u0645 \u0627\u0644\u062a\u062c\u0627\u0631\u064a\u0625.</p><h3>7. \u062a\u062d\u062f\u064a\u062f \u0627\u0644\u0645\u0633\u0624\u0648\u0644\u064a\u0625</h3><p>\u0644\u0627 \u064a\u062a\u062d\u0645\u0644 E-Shop \u0627\u0644\u0645\u0633\u0624\u0648\u0644\u064a\u0625 \u0639\u0646 \u0627\u0644\u0623\u0636\u0631\u0627\u0631 \u063a\u064a\u0631 \u0627\u0644\u0645\u062b\u0644 \u0623\u0648 \u0627\u0644\u0639\u0631\u0636\u064a\u0625 \u0623\u0648 \u0627\u0644\u062a\u0628\u0639\u064a\u0625 \u0627\u0644\u0646\u0627\u062a\u062c\u0625 \u0639\u0646 \u0646\u0632\u0627\u0639\u0627\u062a \u0627\u0644\u0645\u0639\u0627\u0645\u0644\u0627\u062a \u0623\u0648 \u0627\u0646\u0642\u0637\u0627\u0639 \u0627\u0644\u062e\u062f\u0645\u0625.</p>

