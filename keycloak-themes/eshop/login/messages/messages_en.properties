termsText=<div class="kc-terms-metadata"><span>Version 1.0</span> &bull; <span>Updated: June 2026</span></div><p>Welcome to the E-Shop Enterprise Marketplace. Please read our Terms of Service and Privacy Policy carefully before using our platform.</p><h3>1. Account Usage</h3><p>Sellers and buyers must maintain accurate account information and secure credentials. E-Shop reserves the right to suspend accounts violating our platform integrity.</p><h3>2. Seller Responsibilities</h3><p>Merchants are responsible for listing accuracy, fulfillment timelines, inventory updates, and compliance with local retail regulations.</p><h3>3. Payment Processing</h3><p>All payments are securely processed via Stripe/E-Shop Payments. Out-of-band transactions are strictly prohibited and subject to account termination.</p><h3>4. Refund Policy</h3><p>Refunds must comply with E-Shop's global customer satisfaction guarantee unless a custom merchant policy is explicitly approved and displayed.</p><h3>5. Data Privacy</h3><p>We process personal and store data in accordance with our Privacy Policy and global security certifications (PCI-DSS, ISO 27001).</p><h3>6. Intellectual Property</h3><p>E-Shop retains all rights to its software, marketplace assets, design patterns, and proprietary data models. Merchants retain rights to their branding.</p><h3>7. Limitation of Liability</h3><p>E-Shop is not liable for indirect, incidental, or consequential damages resulting from transaction disputes or service interruptions.</p>

