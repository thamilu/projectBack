name: E-Shop CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: eshop
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v6
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Code Style & Quality Checks
      run: ./gradlew spotlessCheck checkstyleMain --no-daemon

    - name: Build with Gradle
      run: ./gradlew build -x test --no-daemon

    - name: Run Unit & Integration Tests
      run: ./gradlew test --no-daemon
      env:
        DB_URL: jdbc:postgresql://localhost:5432/eshop
        DB_USERNAME: test
        DB_PASSWORD: test
        REDIS_HOST: localhost
        REDIS_PORT: 6379
        JWT_SECRET: ci_test_secret_key_32_characters_long
        JWT_EXPIRATION: 3600000

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: build/test-results/test
