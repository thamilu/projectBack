version: "3.9"

# ══════════════════════════════════════════════════════════════
# PRODUCTION DEPLOYMENT CONFIGURATION
# - Nginx reverse proxy with SSL
# - Monitoring with Prometheus + Grafana
# - External managed services (Redis, Keycloak)
# - Production security hardening
# ══════════════════════════════════════════════════════════════

services:
  # ══════════════════════════════════════════════════════════════
  # PostgreSQL Database (Production)
  # ══════════════════════════════════════════════════════════════
  postgres:
    image: postgres:16-alpine
    container_name: eshop-postgres-prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eshop_prod}
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    networks:
      - eshop-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ══════════════════════════════════════════════════════════════
  # Spring Boot Backend (Production)
  # ══════════════════════════════════════════════════════════════
  app:
    image: ${DOCKER_REGISTRY:-eshop-backend}:${VERSION:-latest}
    container_name: eshop-backend-prod
    restart: always
    environment:
      # Profile
      SPRING_PROFILES_ACTIVE: prod
      
      # Database (can be external managed database)
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      
      # Redis (external managed service recommended)
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      
      # Keycloak (external managed service)
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI}
      KEYCLOAK_JWK_URI: ${KEYCLOAK_JWK_URI}
      
      # Security
      JWT_SECRET: ${JWT_SECRET}
      
      # CORS
      CORS_ORIGINS: ${CORS_ORIGINS}
      
      # Payment Gateways
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      
      # Monitoring
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
      
      # JVM Options
      JAVA_OPTS: >
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=75.0
        -XX:+UseG1GC
        -XX:+UseStringDeduplication
        -Djava.security.egd=file:/dev/./urandom
        -Dspring.profiles.active=prod
    volumes:
      - ./logs:/var/log/eshop
      - ./uploads:/var/eshop/uploads
    networks:
      - eshop-network
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8082"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G

  # ══════════════════════════════════════════════════════════════
  # Nginx - Reverse Proxy with SSL
  # ══════════════════════════════════════════════════════════════
  nginx:
    image: nginx:alpine
    container_name: eshop-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
    networks:
      - eshop-network
    depends_on:
      - app
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/80"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ══════════════════════════════════════════════════════════════
  # Prometheus - Metrics Collection (Production)
  # ══════════════════════════════════════════════════════════════
  prometheus:
    image: prom/prometheus:latest
    container_name: eshop-prometheus-prod
    restart: always
    ports:
      - "127.0.0.1:9090:9090"  # Only accessible from localhost
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - eshop-network
    depends_on:
      - app
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # ══════════════════════════════════════════════════════════════
  # Grafana - Metrics Visualization (Production)
  # ══════════════════════════════════════════════════════════════
  grafana:
    image: grafana/grafana:latest
    container_name: eshop-grafana-prod
    restart: always
    ports:
      - "127.0.0.1:3000:3000"  # Only accessible from localhost
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost:3000}
      - GF_INSTALL_PLUGINS=
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - eshop-network
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # ══════════════════════════════════════════════════════════════
  # Zipkin - Distributed Tracing (Production)
  # ══════════════════════════════════════════════════════════════
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: eshop-zipkin-prod
    restart: always
    ports:
      - "127.0.0.1:9411:9411"  # Only accessible from localhost
    environment:
      - STORAGE_TYPE=mem
    networks:
      - eshop-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

# ══════════════════════════════════════════════════════════════
# Volumes - Persistent Data Storage
# ══════════════════════════════════════════════════════════════
volumes:
  postgres_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

# ══════════════════════════════════════════════════════════════
# Networks - Container Communication
# ══════════════════════════════════════════════════════════════
networks:
  eshop-network:
    driver: bridge
