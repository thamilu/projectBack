# ══════════════════════════════════════════════════════════════
# PRODUCTION DEPLOYMENT CONFIGURATION [HARDENED]
# - Nginx reverse proxy with SSL
# - External managed services (Redis, Keycloak)
# - Minimal footprint for low-cost VPS (2GB RAM target)
# ══════════════════════════════════════════════════════════════

services:
  # ══════════════════════════════════════════════════════════════
  # PostgreSQL Database (Production)
  # ══════════════════════════════════════════════════════════════
  postgres:
    image: postgres:16-alpine
    container_name: eshop-postgres-prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eshop_prod}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    networks:
      - eshop-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 256M

  # ══════════════════════════════════════════════════════════════
  # Spring Boot Backend (Production)
  # ══════════════════════════════════════════════════════════════
  app:
    build: .
    image: eshop-backend:latest
    container_name: eshop-backend-prod
    restart: always
    environment:
      # Profile
      SPRING_PROFILES_ACTIVE: prod
      PORT: 8082
      SERVER_PORT: 8082
      
      # Database
      DATABASE_URL: ${DB_URL}
      DATABASE_USERNAME: ${DB_USERNAME}
      DATABASE_PASSWORD: ${DB_PASSWORD}
      
      # Redis
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      
      # Keycloak
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://keycloak:8080/realms/eshop}
      KEYCLOAK_JWK_URI: ${KEYCLOAK_JWK_URI:-http://keycloak:8080/realms/eshop/protocol/openid-connect/certs}
      ADMIN_ISSUER_URI: ${KEYCLOAK_AUTH_SERVER:-http://keycloak:8080}/realms/${ADMIN_REALM_NAME:-master}
      
      # Security
      JWT_SECRET: ${JWT_SECRET}
      
      # CORS
      CORS_ORIGINS: ${ALLOWED_ORIGINS}
      
      # Logging
      LOG_FILE: ${LOG_FILE:-/var/log/eshop/application.log}
      ACCESS_LOG_DIR: ${ACCESS_LOG_DIR:-/var/log/eshop}
      
      # Business & Logic
      DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-INR}
      ALLOWED_GATEWAYS: ${ALLOWED_GATEWAYS:-STRIPE,RAZORPAY}
      MANAGEMENT_PORT: ${MANAGEMENT_PORT:-8083}
      UPLOAD_TEMP_DIR: ${UPLOAD_TEMP_DIR:-/tmp/eshop-uploads}
      
      # Payment Gateways
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      
      # JVM Options
      JAVA_OPTS: >
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=75.0
        -XX:+UseG1GC
        -XX:+UseStringDeduplication
        -Djava.security.egd=file:/dev/./urandom
        -Dspring.profiles.active=prod
    volumes:
      - ./logs:/var/log/eshop
      - ./uploads:/var/eshop/uploads
    networks:
      - eshop-network
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8082"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ══════════════════════════════════════════════════════════════
  # Nginx - Reverse Proxy with SSL
  # ══════════════════════════════════════════════════════════════
  nginx:
    image: nginx:alpine
    container_name: eshop-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
    networks:
      - eshop-network
    depends_on:
      - app
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/80"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M

  # ══════════════════════════════════════════════════════════════
  # Keycloak - Authentication Server (Production Hardened)
  # ══════════════════════════════════════════════════════════════
  keycloak:
    image: quay.io/keycloak/keycloak:26.5.2
    container_name: eshop-keycloak-prod
    restart: always
    command: start --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/eshop_keycloak
      KC_DB_USERNAME: ${DB_USERNAME:-postgres}
      KC_DB_PASSWORD: ${DB_PASSWORD:-password}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-localhost}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_LOG_LEVEL: warn
      KC_METRICS_ENABLED: "false"
      KC_HEALTH_ENABLED: "true"
      # JVM Tuning for 2GB VPS
      JAVA_OPTS: "-Xms256m -Xmx512m -XX:+UseG1GC -XX:+UseContainerSupport"
    volumes:
      - ./keycloak/themes:/opt/keycloak/themes
      - ./keycloak/import:/opt/keycloak/data/import
    networks:
      - eshop-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 512M

# ══════════════════════════════════════════════════════════════
# Volumes - Persistent Data Storage
# ══════════════════════════════════════════════════════════════
volumes:
  postgres_data:
    driver: local

# ══════════════════════════════════════════════════════════════
# Networks - Container Communication
# ══════════════════════════════════════════════════════════════
networks:
  eshop-network:
    driver: bridge
